[project]
name = "ai-agents-platform-backend"
version = "0.1.0"
description = "Corporate AI agents platform backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0,<2.12.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "flower>=2.0.0",
  "imapclient>=3.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "sentence-transformers>=3.0.0",
  "qdrant-client>=1.11.0",
  "minio>=7.2.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "httpx>=0.27.0",
  "exchangelib>=5.4.0",
  "structlog>=24.1.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.cfo_head_agent" = ["prompts/*.md"]
"app.agents.finance_director_agent" = ["prompts/*.md"]
"app.agents.executive_director_agent" = ["prompts/*.md"]
"app.agents.chief_accountant_agent" = ["prompts/*.md"]
"app.agents.accountant_agent" = ["prompts/*.md"]
"app.agents.legal_specialist_agent" = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/agents"]
markers = [
  "integration: tests that use configured external infrastructure",
]

[dependency-groups]
dev = [
    "memory-profiler>=0.61.0",
    "objgraph>=3.6.2",
]
