[project]
name = "agent-pochta"
version = "0.1.0"
description = "ИИ-агент обработки входящей корреспонденции (ТЗ-АГТ-ПОЧТА-001)"
requires-python = ">=3.11"
dependencies = [
    # Оркестрация и LLM
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Конфигурация и модели
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Хранилище метаданных
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Очередь задач
    "celery>=5.4",
    # Почта
    "imapclient>=3.0",
    # Векторная БД (RAG)
    "qdrant-client>=1.9",
    # Утилиты
    "structlog>=24.1",
    "tenacity>=8.3",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Обработка вложений — нужна только если Document Service платформы недоступен
# и парсинг выполняется локально внутри агента.
documents = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pytesseract>=0.3.10",
    "pillow>=10.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pochta"]
force-include = { "src/agent_pochta/routing/data" = "agent_pochta/routing/data" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
