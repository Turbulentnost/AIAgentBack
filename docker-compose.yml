name: agent-pochta

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_pochta
    QDRANT_URL: http://qdrant:6333
    RAG_BACKEND: qdrant
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    # Локальный GPU/LM Studio: 2-4; выше — LLM-шторм и зависания пула.
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
  volumes:
    - ./data:/app/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_pochta
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_pochta"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/run_migrate.py"]

  rag-init:
    <<: *app
    restart: "no"
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "scripts/init_qdrant.py"]

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    command: ["python", "scripts/run_api.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "exec celery -A agent_pochta.workers.celery_app:celery_app worker --loglevel=info -Q celery --concurrency=$${CELERY_WORKER_CONCURRENCY:-3}",
      ]

  # ETA/countdown от retry_erp иначе держат unacks на той же очереди, что process_email.
  celery-erp-worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "agent_pochta.workers.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "erp",
        "--concurrency=1",
      ]

  celery-imap-worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "agent_pochta.workers.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "imap",
        "--concurrency=1",
      ]

  celery-beat:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - .:/app/repo_root:rw
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_pochta
      QDRANT_URL: http://qdrant:6333
      RAG_BACKEND: qdrant
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      # Локальный GPU/LM Studio: 2-4; выше — LLM-шторм и зависания пула.
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
      STATS_EXPORT_DIR: data/stats
      STATS_REPO_ROOT: /app/repo_root
      STATS_START_TIME: "2026-07-08 08:35:00"
      STATS_TIMEZONE: Europe/Moscow
      STATS_EXPORT_INTERVAL_SEC: 600
    command:
      [
        "celery",
        "-A",
        "agent_pochta.workers.celery_app:celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  rabbitmq_data:
