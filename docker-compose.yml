name: agent-pochta

# Почта снаружи: POCHTA_API_HOST_PORT=8081, внутри контейнера API всегда :8080
# ESKD backend: ESKD_BACKEND_PORT=8080
# Model API ESKD: eskd-model :8765 (или хост :8765 → ESKD_MODEL_SERVICE_URL=host.docker.internal:8765)
# UI: FRONTEND_PORT=5174 → http://localhost:5174/agents/incoming-mail
# Запуск ESKD+почта+UI: docker compose up -d eskd-postgres eskd-model eskd-backend api celery-worker celery-imap-worker frontend

x-app: &app
  build:
    context: .
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}
      PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_pochta
    QDRANT_URL: http://qdrant:6333
    RAG_BACKEND: qdrant
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    # Узел 5: эмбеддинг письма → Qdrant department_corrections_bge
    BGE_DEPARTMENT_ROUTING_ENABLED: ${BGE_DEPARTMENT_ROUTING_ENABLED:-true}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://192.168.1.157:1234/v1}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-user-bge-m3}
    EMAIL_RAG_ENABLED: ${EMAIL_RAG_ENABLED:-true}
    # Локальный GPU/LM Studio: 2-4; выше — LLM-шторм и зависания пула.
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
  volumes:
    - ./data:/app/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_pochta
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_pochta"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/run_migrate.py"]

  rag-init:
    <<: *app
    restart: "no"
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "scripts/init_qdrant.py"]

  api:
    <<: *app
    # Не добавляйте здесь environment: с одной переменной — YAML merge заменит x-app
    # целиком, и api возьмёт DATABASE_URL=localhost:5433 из .env → 500 на /metrics.
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${POCHTA_API_HOST_PORT:-8081}:8080"
    command: ["python", "scripts/run_api.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "exec celery -A agent_pochta.workers.celery_app:celery_app worker --loglevel=info -Q celery --concurrency=$${CELERY_WORKER_CONCURRENCY:-3}",
      ]

  # ETA/countdown от retry_erp иначе держат unacks на той же очереди, что process_email.
  celery-erp-worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "agent_pochta.workers.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "erp",
        "--concurrency=1",
      ]

  celery-imap-worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "agent_pochta.workers.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "imap",
        "--concurrency=1",
      ]

  celery-beat:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - .:/app/repo_root:rw
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_pochta
      QDRANT_URL: http://qdrant:6333
      RAG_BACKEND: qdrant
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      # Локальный GPU/LM Studio: 2-4; выше — LLM-шторм и зависания пула.
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
      STATS_EXPORT_DIR: data/stats
      STATS_REPO_ROOT: /app/repo_root
      STATS_START_TIME: "2026-07-08 08:35:00"
      STATS_TIMEZONE: Europe/Moscow
      STATS_EXPORT_INTERVAL_SEC: 600
    command:
      [
        "celery",
        "-A",
        "agent_pochta.workers.celery_app:celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── ESKD Agent (agent_nd/агенты/eskd-agent) ───────────────────────────────
  eskd-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ESKD_POSTGRES_USER:-eskd}
      POSTGRES_PASSWORD: ${ESKD_POSTGRES_PASSWORD:-eskd}
      POSTGRES_DB: ${ESKD_POSTGRES_DB:-eskd_agent}
    volumes:
      - eskd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ESKD_POSTGRES_USER:-eskd} -d ${ESKD_POSTGRES_DB:-eskd_agent}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  eskd-model:
    image: python:3.12-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "pip install -q httpx 'fastapi>=0.115' 'uvicorn[standard]>=0.30' python-multipart && exec python eskd_model_api.py --host 0.0.0.0 --port 8765",
      ]
    env_file:
      - path: eskd.env
        required: false
    volumes:
      - ../../../agent_nd/агенты/eskd-agent/model:/app
    ports:
      - "${ESKD_MODEL_PORT:-8765}:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  eskd-backend:
    build:
      context: ../../../agent_nd/агенты/eskd-agent/backend
      target: production
    env_file:
      - path: eskd.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODEL_SERVICE_URL: ${ESKD_MODEL_SERVICE_URL:-http://eskd-model:8765}
      CORS_ORIGINS: ${ESKD_CORS_ORIGINS:-*}
      MAX_UPLOAD_MB: ${ESKD_MAX_UPLOAD_MB:-200}
      DATABASE_URL: postgresql+asyncpg://${ESKD_POSTGRES_USER:-eskd}:${ESKD_POSTGRES_PASSWORD:-eskd}@eskd-postgres:5432/${ESKD_POSTGRES_DB:-eskd_agent}
      STORAGE_PATH: /data/previews
      UPLOADS_PATH: /data/uploads
      AUTH_MODE: ${ESKD_AUTH_MODE:-dev}
      DEV_DEFAULT_ROLES: ${ESKD_DEV_DEFAULT_ROLES:-ESKD_OTK}
      INTEGRATION_WORKER_ENABLED: ${ESKD_INTEGRATION_WORKER_ENABLED:-true}
    volumes:
      - eskd_storage:/data/previews
      - eskd_uploads:/data/uploads
      - eskd_integration:/data/integration
      - ./data/eskd_polza_bench:/bench/data:ro
      - ./data/temp/eskd_polza_src:/bench/src:ro
    ports:
      - "${ESKD_BACKEND_PORT:-8080}:8080"
    depends_on:
      eskd-postgres:
        condition: service_healthy
      eskd-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── UI agent_nd_front (Vite dev, :5174) + ESKD UI внутри (/eskd-ui → :5173) ─
  frontend:
    build:
      context: ../../../agent_nd_front
      target: development
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    environment:
      VITE_POCHTA_API_PROXY: http://api:8080
      VITE_ESKD_API_PROXY: http://eskd-backend:8080
      VITE_ESKD_API_URL: /eskd-api
      VITE_ESKD_UI_URL: /eskd-ui
      VITE_ESKD_UI_PROXY: http://127.0.0.1:5173
      ESKD_VITE_API_PROXY: http://eskd-backend:8080
      ESKD_APP_DIR: /eskd-app
      VITE_API_PROXY: ${VITE_API_PROXY:-http://host.docker.internal:8002}
      VITE_API_SERVER: ${VITE_API_SERVER:-http://host.docker.internal:8002}
      VITE_SKIP_AUTH: ${VITE_SKIP_AUTH:-true}
      VITE_INCOMING_MAIL_PUBLIC: ${VITE_INCOMING_MAIL_PUBLIC:-true}
      VITE_STANDALONE_INCOMING_MAIL: ${VITE_STANDALONE_INCOMING_MAIL:-false}
      VITE_ONEC_API_SERVER: ${VITE_ONEC_API_SERVER:-http://192.168.0.247:8000}
    volumes:
      - ../../../agent_nd_front:/app
      - ../../../agent_nd/агенты/eskd-agent/frontend:/eskd-app
      - frontend_node_modules:/app/node_modules
      - eskd_frontend_node_modules:/eskd-app/node_modules
    command: ["sh", "/app/docker-dev-entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
      eskd-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  rabbitmq_data:
  eskd_pg_data:
  eskd_storage:
  eskd_uploads:
  eskd_integration:
  eskd_frontend_node_modules:
  frontend_node_modules:
