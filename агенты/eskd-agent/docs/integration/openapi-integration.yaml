openapi: 3.0.3
info:
  title: ESKD Agent Integration API
  version: 1.0.0
  description: Public M2M API (п. 4.8) — checks, webhooks, ERP, SED
servers:
  - url: /api/v1
paths:
  /checks:
    post:
      summary: Create check (multipart)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-API-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, files]
              properties:
                metadata:
                  type: string
                  description: JSON CheckCreateRequest
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202":
          description: Check accepted
  /checks/{check_id}:
    get:
      summary: Check status and summary
      parameters:
        - in: path
          name: check_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: CheckSummaryResponse
  /checks/{check_id}/findings:
    get:
      summary: Structured findings
  /checks/{check_id}/report:
    get:
      summary: PDF or JSON protocol
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [pdf, json] }
  /checks/{check_id}/cancel:
    post:
      summary: Cancel running check
  /rulesets:
    get:
      summary: Ruleset versions
  /webhooks:
    post:
      summary: Register webhook
    get:
      summary: List webhooks
  /erp/context:
    post:
      summary: Update ERP document context from 1C
  /erp/readiness/{document_id}:
    get:
      summary: Production readiness for 1C
  /sed/archive:
    post:
      summary: Archive protocol to SED store
  /integration/exchange-log:
    get:
      summary: Integration exchange journal (admin)
  /auth/me:
    get:
      summary: Current principal and roles
