# DEPRECATED: используйте ./stack.sh
# Модульные файлы: compose/*.yml
#
# Запуск (legacy):
#   docker-compose up -d --build
#   docker-compose -f docker-compose.yml -f docker-compose.ui.yml up -d backend frontend

services:
  postgres:
    image: postgres:16-alpine
    container_name: eskd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eskd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eskd}
      POSTGRES_DB: ${POSTGRES_DB:-eskd_agent}
    volumes:
      - eskd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eskd} -d ${POSTGRES_DB:-eskd_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eskd

  model:
    profiles: [docker-model]
    build:
      context: ..
      dockerfile: eskd-agent/model/Dockerfile
    container_name: eskd-model
    env_file:
      - .env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ..:/app:ro
      - ${BASE_MODEL_PATH:-../models/gemma-3n-e4b-hf}:/models/base:ro
      - ${ADAPTER_PATH:-../dist/kaggle_release/gemma-3n-eskd-lora}:/models/adapter:ro
      - hf_cache:/root/.cache/huggingface
    command:
      - python
      - /app/scripts/finetune/gemma3n_eskd_api.py
      - --host
      - "0.0.0.0"
      - --port
      - "8765"
      - --preload
      - --model
      - /models/base
      - --adapter
      - /models/adapter
      - --max-items
      - "${MAX_ITEMS:-50}"
    expose:
      - "8765"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks:
      - eskd

  backend:
    build:
      context: ./backend
      target: production
    container_name: eskd-backend
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-http://host.docker.internal:8765}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://eskd:eskd@postgres:5432/eskd_agent}
      STORAGE_PATH: ${STORAGE_PATH:-/data/previews}
      UPLOADS_PATH: ${UPLOADS_PATH:-/data/uploads}
      ODA_CONVERTER_PATH: ${ODA_CONVERTER_PATH:-}
      KOMPAS_EXPORT_CMD: ${KOMPAS_EXPORT_CMD:-}
    volumes:
      - eskd_storage:/data/previews
      - eskd_uploads:/data/uploads
      - eskd_integration:/data/integration
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - eskd

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: eskd-frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_LAN_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eskd

volumes:
  hf_cache:
  eskd_pg_data:
  eskd_storage:
  eskd_uploads:
  eskd_integration:

networks:
  eskd:
    driver: bridge
