# DEPRECATED: используйте ./stack.sh dev frontend --model-host
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up frontend backend postgres

services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_started

  backend:
    environment:
      MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-http://host.docker.internal:8765}

  model:
    profiles: [never]
