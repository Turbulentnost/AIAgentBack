# Backend hot reload for local development.
services:
  backend:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/srv
      - eskd_storage:/data/previews
      - eskd_integration:/data/integration
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --reload
      - --timeout-keep-alive
      - "600"
    environment:
      MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-http://host.docker.internal:8765}
