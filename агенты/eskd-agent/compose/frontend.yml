services:
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: eskd-frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eskd
