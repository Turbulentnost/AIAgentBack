services:
  model:
    profiles: [model]
    build:
      context: ..
      dockerfile: eskd-agent/model/Dockerfile
    container_name: eskd-model
    env_file:
      - ./.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ..:/app:ro
      - ${BASE_MODEL_PATH:-../models/gemma-3n-e4b-hf}:/models/base:ro
      - ${ADAPTER_PATH:-../dist/kaggle_release/gemma-3n-eskd-lora}:/models/adapter:ro
      - hf_cache:/root/.cache/huggingface
    command:
      - python
      - /app/scripts/finetune/gemma3n_eskd_api.py
      - --host
      - "0.0.0.0"
      - --port
      - "8765"
      - --preload
      - --model
      - /models/base
      - --adapter
      - /models/adapter
      - --max-items
      - "${MAX_ITEMS:-50}"
    expose:
      - "8765"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    networks:
      - eskd
