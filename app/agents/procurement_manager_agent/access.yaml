# access.yaml — разграничение доступа RBAC/ABAC (п. 4.6 ТЗ-ПЛАТФ-001).
# Принцип минимальных прав: агент видит только объекты, необходимые роли и текущему кейсу.
agent_id: procurement_manager_agent
role_id: procurement_manager
contour: "№3 — Закупка и выбор поставщика"
model: abac

subject:
  service_account: svc_procurement_manager_agent
  idp: keycloak            # + AD/LDAP, SSO

allowed_sources:           # см. sources.yaml
  - onec_erp:read          # только объекты раздела «Объекты 1С в области видимости»
  - knowledge_base:read    # только документы раздела «Источники»

denied:
  - onec_crm:*             # коммерческая переписка клиентов
  - accounting_registers:* # бухгалтерские регистры
  - internet:*             # только через integration-service

write_gate:
  requires_hitl: true      # запись возможна только после узла HITL
  whitelist_methods:       # белый список HTTP-сервиса 1С
    - /hs/agents/v1/*

# Уровневые ограничения (агентный/документный/инструментальный/процессный/аудиторский):
levels:
  agent: "Закупочные объекты контура №3 и связанные объекты №4/№5 в пределах кейса. Бухгалтерские регистры и полная переписка клиентов недоступны."
  document: "СТО-28-020, СТО-10-095, ПЛ-34-048, шаблоны RFQ/договора/претензии; КД/ТД — в объёме проверяемой позиции."
  tool: "Только инструменты из tools.yaml. Инструменты внешней отправки не декларируются в принципе."
  process: "Заключения КБ/ГСПП и СБ — только через оркестратор от профильных агентов."
  audit: "Каждый вызов инструмента и каждый проект документа фиксируются в tool_calls и audit_logs с correlation_id."
