# hitl.yaml — точки human-in-the-loop (п. 4.9 ТЗ-ПЛАТФ-001).
# Действие из этого перечня, выполненное без прохождения соответствующего узла графа,
# классифицируется как неавторизованное действие ИИ-агента (целевое значение — 0);
# при выявлении агент автоматически переводится в статус «Приостановлен».
agent_id: procurement_manager_agent

points:
  - action: "Отправка RFQ поставщику"
    approver_role: "Ведущий менеджер / менеджер по закупкам"
    node: human_send_rfq
    note: "Агент не отправляет; формирует только проект."

  - action: "Выбор предложения из сравнительной таблицы"
    approver_role: "Ведущий менеджер / менеджер по закупкам"
    node: human_select_supplier

  - action: "Утверждение аналога или отклонения от КД"
    approver_role: "Инженер КБ / ГСПП + уполномоченный руководитель"
    node: route_to_kb_agent

  - action: "Утверждение нового или рискового поставщика"
    approver_role: "Начальник ОМТО / СБ / юрист по маршруту"
    node: route_to_sb_agent

  - action: "Подпись и согласование договора"
    approver_role: "Уполномоченные лица (+ юрист, СБ)"
    node: draft_order_and_contract

  - action: "Размещение заказа (возникновение внешнего обязательства)"
    approver_role: "Ведущий менеджер / начальник ОМТО"
    node: draft_order_and_contract

  - action: "Согласование служебной записки на цену (шаг 3.3)"
    approver_role: "Начальник ОМТО + финансовая функция"
    node: draft_claim

  - action: "Направление претензии поставщику"
    approver_role: "Юрист / уполномоченный сотрудник"
    node: draft_claim
