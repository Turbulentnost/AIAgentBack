# hitl.yaml — точки human-in-the-loop (п. 4.9 ТЗ-ПЛАТФ-001).
# Действие из этого перечня, выполненное без прохождения соответствующего узла графа,
# классифицируется как неавторизованное действие ИИ-агента (целевое значение — 0);
# при выявлении агент автоматически переводится в статус «Приостановлен».
agent_id: omto_deputy_agent

points:
  - action: "Подтверждение назначения ответственного менеджера"
    approver_role: "Начальник ОМТО"
    node: human_confirm
    note: "Агент формирует только проект назначения; утверждение — за начальником ОМТО."

  - action: "Подтверждение связывания позиции с существующим кейсом при выявленном дубле"
    approver_role: "Начальник ОМТО"
    node: link_to_existing_case

  - action: "Утверждение предложения по перераспределению нагрузки"
    approver_role: "Начальник ОМТО"
    node: human_confirm

  - action: "Запись ответственного в 1С:ERP"
    approver_role: "Выполняется агентом только после подтверждения (узел human_confirm)"
    node: writeback_1c
    note: "call_tool(write=True, hitl_passed=True) — только после узла human_confirm."
