# sources.yaml — декларация источников и прав (п. 4.6/4.7) → data_sources,
# source_permissions, source_references. Правила подтверждения источников.
agent_id: omto_deputy_agent

sources:
  - id: onec_erp
    type: erp
    access: read
    via: integration-service          # прямой доступ запрещён
    objects:                          # объекты 1С в области видимости (раздел 7.2 / TABLE 9)
      - "Документ.ЗаявкаНаЗакупку"        # запись реквизита «Ответственный» — HTTP-сервис (после HITL)
      - "Документ.ЗаказПоставщику"        # открытые заказы для проверки дубля (чтение)
      - "Справочник.Номенклатура / НоменклатурныеГруппы"  # классификация позиции
      - "Справочник.Пользователи / Сотрудники"            # менеджеры, специализация, доступность
      - "Регистр «Загрузка менеджеров»"                    # взвешенная загрузка (HTTP-сервис)

  - id: knowledge_base
    type: rag
    access: read
    search: hybrid                    # вектор + полнотекст (п. 4.3)
    documents:
      - "СТО-28-020 «Закупки» (версия 07)"
      - "Внутренние правила распределения позиций"
      - "Матрица специализаций менеджеров"

# Правила подтверждения источников (source_reference обязателен для существенных выводов):
source_confirmation:
  require_fields: [document, clause, version, accessed_at, status]
  external_status_values: [официальный, проверенный, неофициальный,
                           "требует проверки", устаревший, заменён, отменён]
  policy: "Каждый существенный вывод сопровождается ссылкой на документ, пункт, версию и дату обращения."
