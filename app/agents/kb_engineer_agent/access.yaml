# access.yaml — разграничение доступа RBAC/ABAC (п. 4.6 / раздел 9 ТЗ). [TABLE 10]
# Принцип минимальных прав: агент видит только объекты, необходимые роли и текущему кейсу.
agent_id: kb_engineer_agent
role_id: kb_engineer
contour: "№3 — Закупка и выбор поставщика"
model: abac

subject:
  service_account: svc_kb_engineer_agent
  idp: keycloak            # + AD/LDAP, SSO

allowed_sources:           # см. sources.yaml
  - onec_erp:read          # только объекты раздела 7.2
  - knowledge_base:read    # только документы раздела 8

denied:
  - onec_crm:*             # коммерческая переписка клиентов
  - accounting_registers:* # бухгалтерские регистры
  - internet:*             # только через integration-service

write_gate:
  requires_hitl: true      # запись возможна только после узла HITL
  whitelist_methods:       # белый список HTTP-сервиса 1С
    - /hs/agents/v1/*

# Уровневые ограничения (агентный/документный/инструментальный/процессный/аудиторский):
levels:
  agent: "КД/ТД, спецификации и карточки позиций. Цены, коммерческие условия, счета, реестр платежей и данные СБ недоступны."
  document: "КД/ТД в объёме проверяемой позиции и связанных изделий; применимые ГОСТ; СТО-28-020, СТО-10-095."
  tool: "Только инструменты из tools.yaml. erp.write_deviation_approval вызывается исключительно после узла human_approve."
  process: "Коммерческая оценка аналога и выбор поставщика — область агента менеджера по закупкам; агент КБ не формирует по ним выводов."
  audit: "Каждое утверждение заключения имеет source_reference с документом, пунктом, версией и датой обращения; всё фиксируется в audit_logs."
