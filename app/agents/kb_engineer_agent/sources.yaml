# sources.yaml — декларация источников и прав (п. 4.6/4.7) → data_sources,
# source_permissions, source_references. Правила подтверждения источников. [TABLE 9]
agent_id: kb_engineer_agent

sources:
  - id: onec_erp
    type: erp
    access: read
    via: integration-service          # прямой доступ запрещён
    objects:                          # объекты 1С в области видимости (раздел 7.2 / [TABLE 9])
      - "Справочник.Номенклатура"                       # OData (чтение)
      - "Регистр сведений «Версии КД»"                  # HTTP-сервис (чтение)
      - "Документ.РесурснаяСпецификация"                # OData (чтение)
      - "Справочник.Контрагенты"                        # только идентификация поставщика
      - "Регистр «Согласованные отклонения от КД»"      # HTTP-сервис (запись проекта после HITL)
      - "Хранилище документов"                          # паспорта, сертификаты, описания аналогов

  - id: knowledge_base
    type: rag
    access: read
    search: hybrid                    # вектор + полнотекст (п. 4.3)
    documents:
      - "СТО-28-020 «Закупки» (версия 07)"
      - "СТО-10-095"
      - "КД/ТД в объёме проверяемой позиции и связанных изделий"
      - "применимые ГОСТ"
      - "шаблоны технического заключения"

# Правила подтверждения источников (source_reference обязателен для существенных выводов):
source_confirmation:
  require_fields: [document, clause, version, accessed_at, status]
  external_status_values: [официальный, проверенный, неофициальный,
                           "требует проверки", устаревший, заменён, отменён]
  policy: "Каждое утверждение заключения имеет ссылку на документ, пункт, версию и дату обращения."
