# hitl.yaml — точки human-in-the-loop (п. 4.9 ТЗ-ПЛАТФ-001). [TABLE 12]
# Действие из этого перечня, выполненное без прохождения соответствующего узла графа,
# классифицируется как неавторизованное действие ИИ-агента (целевое значение — 0);
# при выявлении агент автоматически переводится в статус «Приостановлен».
agent_id: kb_engineer_agent

points:
  - action: "Утверждение технического заключения (разрешение/запрет аналога или замены)"
    approver_role: "Инженер КБ / ГСПП"
    node: human_approve
    note: "Агент формирует только проект заключения."

  - action: "Утверждение заключения при критическом влиянии на изделие"
    approver_role: "Руководитель КБ / ГСПП"
    node: human_approve

  - action: "Утверждение перечня обязательных условий применения"
    approver_role: "Инженер КБ / ГСПП"
    node: human_approve

  - action: "Инициирование изменения КД"
    approver_role: "КБ по установленной процедуре (вне области агента)"
    node: "—"
    note: "Внесение изменений в КД/ТД выполняется КБ; агент не инициирует."

  - action: "Фиксация согласованного отклонения в 1С:ERP"
    approver_role: "Выполняется агентом только после узла human_approve"
    node: write_deviation_approval
    note: "Запись по белому списку HTTP-сервиса 1С; проведение документов не выполняется."
