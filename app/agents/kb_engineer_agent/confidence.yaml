# confidence.yaml — правила снижения уверенности и эскалации (п. 4.7 / раздел 8.2 ТЗ).
# Узел assess_confidence понижает data_confidence и выставляет requires_human_review.
agent_id: kb_engineer_agent
version: 1

# Условия обязательного снижения уверенности и передачи человеку (раздел 8.2 ТЗ):
#  - КД по позиции не найдена либо несколько версий без однозначного признака актуальности;
#  - статус КД устаревший/заменён/отменён — заключение не выдаётся ни при каком покрытии;
#  - покрытие обязательных критериев < 100% — заключение не выдаётся, формируется перечень
#    недостающих данных;
#  - данные аналога заявлены при иных условиях измерения, чем требования КД;
#  - актуальность применимого ГОСТ не подтверждена;
#  - источник данных аналога «неофициальный» или «требует проверки»;
#  - критическое влияние на изделие — уверенность не выше medium, подтверждение
#    руководителя КБ/ГСПП;
#  - данные 1С:ERP и КД в базе знаний расходятся по обозначению/применяемости позиции.
rules:
  - id: missing_required_fields
    when: state.errors[?type=='missing_field']
    set_confidence: low
    requires_human_review: true

  - id: source_conflict
    when: conflicting_sources_detected
    set_confidence: low
    requires_human_review: true

  - id: kd_not_actual
    when: state.kd_actual == false
    set_confidence: low
    requires_human_review: true
    block_conclusion: true       # заключение не выдаётся

  - id: coverage_below_100
    when: state.coverage < 100
    set_confidence: low
    requires_human_review: true
    block_conclusion: true       # заключение не выдаётся, формируется перечень недостающих данных

  - id: critical_finding
    when: any(findings[?severity=='critical'])
    max_confidence: medium
    requires_human_review: true

degrade_on:
  - metric: false_escalation_rate
    threshold: 0.05
    action: downgrade_to_U0     # автоматическое понижение автономности

escalation:
  default_role: "Руководитель КБ / ГСПП"
  critical_role: "Руководитель КБ / ГСПП (техническая функция)"
