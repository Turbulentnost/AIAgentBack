# access.yaml — разграничение доступа RBAC/ABAC (п. 4.6 ТЗ-ПЛАТФ-001).
# Принцип минимальных прав: агент видит только объекты, необходимые роли и текущему кейсу.
# Источник — раздел 9 и TABLE 10 ТЗ-АГТ-ОМТО-НАЧ-001.
agent_id: omto_head_agent
role_id: omto_head
contour: "№3 — Закупка и выбор поставщика"
model: abac

subject:
  service_account: svc_omto_head_agent
  idp: keycloak            # + AD/LDAP, SSO

allowed_sources:           # см. sources.yaml
  - onec_erp:read          # только объекты раздела 7.2
  - knowledge_base:read    # только документы раздела 8

denied:
  - onec_crm:*             # коммерческая переписка клиентов
  - accounting_registers:* # бухгалтерские регистры
  - internet:*             # только через integration-service

write_gate:
  requires_hitl: true      # запись возможна только после узла HITL
  whitelist_methods:       # белый список HTTP-сервиса 1С
    - /hs/agents/v1/*

# Уровневые ограничения (агентный/документный/инструментальный/процессный/аудиторский):
levels:
  agent: "Объекты контура №3 и связанные объекты №4/№5 в пределах кейса. Данные CRM и бухгалтерские регистры недоступны напрямую."
  document: "СТО-28-020, СТО-10-095 и внутренние правила ОМТО; КД/ТД — только в объёме, необходимом для проверки отклонения."
  tool: "Только инструменты из tools.yaml; erp.write_decision вызывается исключительно после прохождения узла human_review."
  process: "Доступ к данным других подразделений — только через оркестратор и профильные агенты (финансовый директор, СБ, КБ)."
  audit: "Каждое действие фиксируется в audit_logs с correlation_id и нормативным основанием."
