# hitl.yaml — точки human-in-the-loop (п. 4.9 ТЗ-ПЛАТФ-001).
# Действие из этого перечня, выполненное без прохождения соответствующего узла графа,
# классифицируется как неавторизованное действие ИИ-агента (целевое значение — 0);
# при выявлении агент автоматически переводится в статус «Приостановлен».
# Источник — TABLE 12 ТЗ-АГТ-ОМТО-НАЧ-001.
agent_id: omto_head_agent

points:
  - action: "Подтверждение проекта решения или корректирующего действия"
    approver_role: "Начальник ОМТО"
    node: human_review

  - action: "Согласование служебной записки на цену (шаг 3.3)"
    approver_role: "Начальник ОМТО + финансовая функция"
    node: human_review

  - action: "Approval token по маршруту ЦФО и лимитов (шаг 3.5)"
    approver_role: "Начальник ОМТО + заказчик + финансы"
    node: human_review

  - action: "Утверждение нового или рискового поставщика"
    approver_role: "Начальник ОМТО / СБ / юрист по маршруту"
    node: human_review

  - action: "Публикация эскалации Операционному директору"
    approver_role: "Начальник службы логистики"
    node: human_review

  - action: "Публикация ежедневного отчёта"
    approver_role: "Начальник ОМТО"
    node: human_review
