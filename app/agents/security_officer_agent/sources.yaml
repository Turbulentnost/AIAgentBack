# sources.yaml — декларация источников и прав (п. 4.6/4.7, TABLE 9) → data_sources,
# source_permissions, source_references. Правила подтверждения источников.
agent_id: security_officer_agent

sources:
  - id: onec_erp
    type: erp
    access: read
    via: integration-service          # прямой доступ запрещён
    objects:                          # объекты 1С в области видимости (раздел 7.2 / TABLE 9 ТЗ)
      - "Справочник.Контрагенты"          # реквизиты, ИНН/ОГРН, статус, признак проверки СБ
      - "Справочник.ДоговорыКонтрагентов" # действующие и исполненные договоры, суммы, сроки
      - "РегистрНакопления.Взаиморасчёты" # история расчётов, просрочки, задолженность
      - "Документ.Претензия"              # претензии и рекламации по контрагенту
      - "Регистр «Проверки контрагентов»" # вердикт, уровень риска, факторы (запись после HITL)

  - id: knowledge_base
    type: rag
    access: read
    search: hybrid                    # вектор + полнотекст (п. 4.3)
    documents:
      - "СТО-28-020 «Закупки» (версия 07)"
      - "внутренние критерии проверки контрагента"
      - "политика работы с персональными данными арендатора"

  - id: official_registries
    type: external
    access: read
    via: integration-service          # белый список; прямой доступ агента запрещён
    note: "Сведения о регистрации, статусе, руководителях, связанности"

# Правила подтверждения источников (source_reference обязателен для существенных выводов):
source_confirmation:
  require_fields: [document, clause, version, accessed_at, status]
  external_status_values: [официальный, проверенный, неофициальный,
                           "требует проверки", устаревший, заменён, отменён]
  policy: "Каждый фактор риска сопровождается ссылкой на источник, датой обращения и статусом надёжности источника."
