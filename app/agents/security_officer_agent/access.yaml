# access.yaml — разграничение доступа RBAC/ABAC (п. 4.6, раздел 9, TABLE 10 ТЗ-АГТ-СБ-001).
# Принцип минимальных прав: агент видит только объекты, необходимые роли и текущему кейсу.
agent_id: security_officer_agent
role_id: security_officer
contour: "№3 — Закупка и выбор поставщика"
model: abac

subject:
  service_account: svc_security_officer_agent
  idp: keycloak            # + AD/LDAP, SSO

allowed_sources:           # см. sources.yaml
  - onec_erp:read          # только объекты раздела 7.2 / TABLE 9
  - knowledge_base:read    # только документы раздела 8

denied:
  - onec_crm:*             # коммерческая переписка клиентов
  - accounting_registers:* # бухгалтерские регистры
  - internet:*             # только через integration-service

write_gate:
  requires_hitl: true      # запись возможна только после узла HITL (human_approve)
  whitelist_methods:       # белый список HTTP-сервиса 1С
    - /hs/agents/v1/*

# Уровневые ограничения (агентный/документный/инструментальный/процессный/аудиторский/данные):
levels:
  agent: "Карточка контрагента, договоры, взаиморасчёты и претензии. КД/ТД, производственный план, проектные цены и полная коммерческая переписка недоступны."
  document: "СТО-28-020, внутренние критерии проверки контрагента, политика работы с персональными данными арендатора."
  tool: "Только инструменты из tools.yaml. Прямое обращение к внешним ресурсам запрещено — только через ext.check_official_registries интеграционного слоя."
  process: "Юридическая проверка договора — область агента юридической службы; финансовое решение — область агента финансового директора."
  audit: "Каждый фактор риска имеет source_reference со ссылкой, датой обращения и статусом источника; всё фиксируется в audit_logs и llm_calls."
  data: "Персональные данные обрабатываются только в объёме, необходимом для проверки контрагента, и в соответствии с политикой арендатора; маскирование выполняется на уровне LLM Gateway (mask_pii=True)."
