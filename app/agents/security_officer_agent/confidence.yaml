# confidence.yaml — правила снижения уверенности и эскалации (п. 4.7, раздел 8.2 ТЗ-АГТ-СБ-001).
# Узел assess_confidence понижает data_confidence и выставляет requires_human_review.
agent_id: security_officer_agent
version: 1

# Условия обязательного снижения уверенности и передачи человеку (раздел 8.2 ТЗ):
#  - контрагент не идентифицируется однозначно: нет ИНН / несколько карточек / расхождение
#    наименования — заключение не выдаётся, возврат закупщику с запросом реквизитов;
#  - покрытие обязательных критериев < 100% — заключение не выдаётся, формируется перечень
#    недостающих сведений;
#  - внешний источник недоступен либо имеет статус «неофициальный» / «требует проверки»;
#  - дата обращения к внешнему источнику превышает допустимый срок актуальности из конфигурации;
#  - данные 1С:ERP и данные официального реестра расходятся (наименование, адрес, статус,
#    руководитель);
#  - выявлен фактор риска, классифицированный как критический — уверенность не выше medium,
#    обязательное утверждение руководителя СБ;
#  - признаки связанности выявлены, но не подтверждены документально;
#  - контрагент подпадает под предусмотренное исключение, но условия исключения не подтверждены
#    конфигурацией арендатора.
rules:
  - id: missing_required_fields
    when: state.errors[?type=='missing_field']
    set_confidence: low
    requires_human_review: true

  - id: source_conflict
    when: conflicting_sources_detected
    set_confidence: low
    requires_human_review: true

  - id: critical_finding
    when: any(findings[?severity=='critical'])
    max_confidence: medium
    requires_human_review: true

degrade_on:
  - metric: false_escalation_rate
    threshold: 0.05
    action: downgrade_to_U0     # автоматическое понижение автономности

escalation:
  default_role: "Руководитель службы безопасности"
  critical_role: "Руководитель службы безопасности (функция проверки контрагента)"
