# hitl.yaml — точки human-in-the-loop (п. 4.9, TABLE 12 ТЗ-АГТ-СБ-001).
# Действие из этого перечня, выполненное без прохождения соответствующего узла графа,
# классифицируется как неавторизованное действие ИИ-агента (целевое значение — 0);
# при выявлении агент автоматически переводится в статус «Приостановлен».
agent_id: security_officer_agent

points:
  - action: "Утверждение заключения по контрагенту (согласование / отказ / условия допуска)"
    approver_role: "Сотрудник службы безопасности"
    node: human_approve

  - action: "Утверждение заключения при критических факторах риска"
    approver_role: "Руководитель службы безопасности"
    node: human_approve

  - action: "Утверждение нового или рискового поставщика"
    approver_role: "Маршрут: начальник ОМТО / СБ / юрист"
    node: human_approve

  - action: "Согласование одноразового исключения до 10 000 руб."
    approver_role: "Финансовый директор И служба безопасности (совместно)"
    node: human_approve

  - action: "Блокировка контрагента в 1С:ERP"
    approver_role: "Человек по утверждённому заключению"
    note: "Выполняется человеком; агент только готовит заключение."

  - action: "Фиксация вердикта в 1С:ERP"
    approver_role: "Выполняется агентом только после узла human_approve"
    node: write_counterparty_verdict
